apiVersion: apps/v1
kind: Deployment
metadata:
  name: animals-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: animals-web
  template:
    metadata:
      labels:
        app: animals-web
    spec:
      containers:
        - name: animals-web
          image: nhom150755/animals-web:1.0
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: animals-web
spec:
  type: NodePort
  selector:
    app: animals-web
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
