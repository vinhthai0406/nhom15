apiVersion: apps/v1
kind: Deployment
metadata:
  name: animals-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: animals-web
  template:
    metadata:
      labels:
        app: animals-web
    spec:
      containers:
        - name: web
          image: nhom150755/animals-web:1.0
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: animals-web
spec:
  selector:
    app: animals-web
  ports:
    - port: 80
      targetPort: 8000
  type: NodePort
