vrrp_instance VI_1 {
    state MASTER/BACKUP
    interface # dùng ip addr để lấy
    virtual_router_id 51 # tùy chọn trong khoảng 1 - 255
    priority # tùy chọn sao cho master cao hơn phần còn lại
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass
    }
    virtual_ipaddress {
        <ip>
    }
}
